<main>
  <section class="hero" style="padding-bottom:48px;">
    <div class="wrap">
      <div class="eyebrow"><span class="tally"></span> Contact</div>
      <h1>Let's connect.</h1>
    </div>
  </section>

  <section class="section" style="border-bottom:none;">
    <div class="wrap contact-grid">
      <div class="contact-info">
        <dl>
          <dt>Location</dt>
          <dd>Washington, DC</dd>
          <dt>Phone</dt>
          <dd><a href="tel:2023706109">202-370-6109</a></dd>
          <dt>Email</dt>
          <dd><a href="mailto:hello@gekjr.com">hello@gekjr.com</a></dd>
          <dt>LinkedIn</dt>
          <dd><a href="https://www.linkedin.com/in/gekjr/" target="_blank" rel="noopener">linkedin.com/in/gekjr</a></dd>
        </dl>
      </div>

      <div>
        <form id="contact-form">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" />
          </div>
          <div class="field">
            <label for="reason">How can I help you today?</label>
            <select id="reason" name="reason" required>
              <option value="">Select one</option>
              <option>General</option>
              <option>Video Creator</option>
              <option>Technical Director</option>
              <option>Video Engineer</option>
              <option>Live Stream Engineer</option>
              <option>Data Wrangler</option>
              <option>Video Playback Op</option>
              <option>Video Record Op</option>
              <option>Camera Op</option>
            </select>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button type="submit" class="btn primary">Send message</button>
          <p class="form-note" id="form-status">We'll get back to you as soon as possible.</p>
        </form>
      </div>
    </div>
  </section>
</main>
