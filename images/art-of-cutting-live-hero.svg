<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="selGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A5A5A"/>
      <stop offset="100%" stop-color="#2B2B2B"/>
    </linearGradient>
    <linearGradient id="mutedFeed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint scanlines -->
  <g opacity="0.05">
    <g stroke="#FFFFFF" stroke-width="1">
      <line x1="0" y1="20" x2="1200" y2="20"/>
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="140" x2="1200" y2="140"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="220" x2="1200" y2="220"/>
      <line x1="0" y1="260" x2="1200" y2="260"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
    </g>
  </g>

  <!-- Monitor wall: 6 tiles, tile 3 is the "selected" cut -->
  <g transform="translate(90,72)">
    <!-- tile 1 -->
    <rect x="0" y="0" width="150" height="90" rx="4" fill="url(#mutedFeed)" stroke="#3A3A3A" stroke-width="1.5"/>
    <path d="M20 70 L45 35 L65 55 L85 25 L110 60 L130 40" stroke="#5C5C5C" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- tile 2 -->
    <rect x="166" y="0" width="150" height="90" rx="4" fill="url(#mutedFeed)" stroke="#3A3A3A" stroke-width="1.5"/>
    <circle cx="241" cy="45" r="22" fill="none" stroke="#5C5C5C" stroke-width="2" opacity="0.7"/>

    <!-- tile 3: SELECTED / on-air -->
    <g filter="url(#softGlow)">
      <rect x="332" y="-6" width="162" height="102" rx="5" fill="url(#selGlow)" stroke="#F2F2F2" stroke-width="3"/>
    </g>
    <path d="M352 68 L375 20 L400 50 L425 15 L455 62 L480 30" stroke="#F5F5F5" stroke-width="2.5" fill="none"/>
    <circle cx="349" cy="4" r="5" fill="#F2F2F2"/>
    <text x="362" y="8" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0A0A0A" letter-spacing="1">ON AIR</text>

    <!-- lower third on the on-air tile -->
    <rect x="332" y="68" width="6" height="20" fill="#F2F2F2"/>
    <rect x="338" y="68" width="156" height="20" fill="#0A0A0A" opacity="0.75"/>

    <!-- tile 4 -->
    <rect x="508" y="0" width="150" height="90" rx="4" fill="url(#mutedFeed)" stroke="#3A3A3A" stroke-width="1.5"/>
    <rect x="530" y="20" width="106" height="50" fill="none" stroke="#5C5C5C" stroke-width="2" opacity="0.7"/>

    <!-- tile 5 -->
    <rect x="674" y="0" width="150" height="90" rx="4" fill="url(#mutedFeed)" stroke="#3A3A3A" stroke-width="1.5"/>
    <path d="M694 55 Q 749 5, 804 55" stroke="#5C5C5C" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- tile 6 -->
    <rect x="840" y="0" width="150" height="90" rx="4" fill="url(#mutedFeed)" stroke="#3A3A3A" stroke-width="1.5"/>
    <circle cx="915" cy="35" r="10" fill="#5C5C5C" opacity="0.7"/>
    <line x1="875" y1="65" x2="955" y2="65" stroke="#5C5C5C" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="248" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="900" fill="#B0B0B0" stroke="#B0B0B0" stroke-width="0.6" paint-order="stroke fill" letter-spacing="4">TECHNICAL DIRECTION</text>

  <!-- title -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#F5F5F5" stroke="#F5F5F5" paint-order="stroke fill" letter-spacing="-1">
    <text x="88" y="326" font-size="70" stroke-width="6">THE ART OF</text>
    <text x="88" y="398" font-size="70" stroke-width="6">CUTTING LIVE</text>
  </g>

  <!-- subtitle -->
  <text x="90" y="440" font-family="Arial, sans-serif" font-size="20" fill="#8C8C8C">What separates a switcher operator from a storyteller</text>

  <!-- bottom rule + tally strip -->
  <rect x="90" y="486" width="1020" height="2" fill="#3A3A3A"/>
  <g transform="translate(90,510)">
    <rect x="0" y="0" width="10" height="10" fill="#F2F2F2"/>
    <text x="20" y="9" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#8C8C8C" letter-spacing="1">PGM · PVW · AUX · KEY · LT · DSK · CUT · DISSOLVE</text>
  </g>
</svg>
