<style>
  :root {
    --ink: #131313;
    --paper: #fbfbf9;
    --tally: #e0332b;
    --tally-dim: #f4d6d4;
    --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-mono);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
  }
  .tally {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--tally);
    box-shadow: 0 0 0 4px rgba(224, 51, 43, 0.25);
    margin-bottom: 28px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .eyebrow {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a8a8a6;
    margin: 0 0 20px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.1;
    margin: 0 0 20px;
    max-width: 16ch;
  }
  h1 .tally-text { color: var(--tally); }
  .date {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.3rem, 3.5vw, 1.8rem);
    color: #fff;
    margin: 0 0 28px;
  }
  p.sub {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #cfcfcf;
    max-width: 42ch;
    margin: 0 0 40px;
  }
  .contact-line {
    font-size: 0.85rem;
    color: #a8a8a6;
    letter-spacing: 0.02em;
  }
  .contact-line a {
    color: #fff;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .contact-line a:hover { color: var(--tally); }
</style>
</head>
<body>
  <span class="tally"></span>

    <a href="https://www.linkedin.com/in/gekjr/" target="_blank" rel="noopener">linkedin.com/in/gekjr</a>
